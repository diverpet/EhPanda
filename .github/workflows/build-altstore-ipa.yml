name: Build AltStore IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      SOURCE_SHA: 5752651cfb44d71be456fdd30810759160b6fee8
    steps:
      - name: Checkout pinned upstream source
        uses: actions/checkout@v7
        with:
          repository: EhPanda-Team/EhPanda
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify source and build tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun swift --version
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Archive unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project EhPanda.xcodeproj \
            -scheme EhPanda \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EhPanda.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/EhPandaDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/EhPandaPackages" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_ENTITLEMENTS= \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            TELEMETRYDECK_APP_ID= \
            TELEMETRYDECK_SALT= \
            2>&1 | tee "$RUNNER_TEMP/ehpanda-archive.log"

      - name: Package and verify IPA
        shell: bash
        run: |
          set -euo pipefail
          export IPA_OUTPUT_DIR="$RUNNER_TEMP/EhPandaIPA"
          mkdir -p "$IPA_OUTPUT_DIR/Payload" "$RUNNER_TEMP/EhPandaOutput"
          ditto "$RUNNER_TEMP/EhPanda.xcarchive/Products/Applications/EhPanda.app" "$IPA_OUTPUT_DIR/Payload/EhPanda.app"
          app="$IPA_OUTPUT_DIR/Payload/EhPanda.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          test "$(xcrun lipo -archs "$app/$executable")" = arm64
          xcrun vtool -show-build "$app/$executable" | tee "$RUNNER_TEMP/EhPandaOutput/macho-build.txt"
          grep -q 'platform IOS$' "$RUNNER_TEMP/EhPandaOutput/macho-build.txt"
          python3 - <<'PY'
          import json, os, pathlib, plistlib, subprocess
          app = pathlib.Path(os.environ['IPA_OUTPUT_DIR']) / 'Payload/EhPanda.app'
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS'], info
          assert info['DTSDKName'].startswith('iphoneos27.1'), info['DTSDKName']
          for p in app.rglob('Info.plist'):
              plistlib.loads(p.read_bytes())
          provenance = {
              'repository': 'https://github.com/EhPanda-Team/EhPanda',
              'branch': 'feature/gsd-phase-17',
              'sourceCommit': os.environ['SOURCE_SHA'],
              'version': info['CFBundleShortVersionString'],
              'build': info['CFBundleVersion'],
              'bundleID': info['CFBundleIdentifier'],
              'minimumOS': info['MinimumOSVersion'],
              'sdk': info['DTSDKName'],
              'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
              'signing': 'unsigned; sign and install with AltStore',
              'workflowRun': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
          }
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'EhPandaOutput/build-info.json'
          output.write_text(json.dumps(provenance, indent=2) + '\n')
          PY
          cd "$IPA_OUTPUT_DIR"
          zip -qry "$RUNNER_TEMP/EhPandaOutput/EhPanda-dev-5752651c.ipa" Payload
          unzip -tq "$RUNNER_TEMP/EhPandaOutput/EhPanda-dev-5752651c.ipa"
          cd "$RUNNER_TEMP/EhPandaOutput"
          shasum -a 256 EhPanda-dev-5752651c.ipa > SHA256SUMS.txt

      - name: Upload IPA and build provenance
        uses: actions/upload-artifact@v7
        with:
          name: EhPanda-dev-5752651c-IPA
          path: ${{ runner.temp }}/EhPandaOutput/
          if-no-files-found: error
          retention-days: 7

      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: EhPanda-dev-5752651c-build-log
          path: ${{ runner.temp }}/ehpanda-archive.log
          if-no-files-found: ignore
          retention-days: 7
